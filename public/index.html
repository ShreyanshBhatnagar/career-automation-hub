<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunity Map — Strategic Workspace</title>
  <style>
    :root {
      --bg: #0a0e14; --surface: #141b26; --surface2: #1c2636;
      --border: #2a3a52; --text: #e8edf4; --muted: #7d92ad;
      --accent: #3d9cf5; --green: #34d399; --amber: #fbbf24; --red: #f87171; --industrial: #52637a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "SF Mono", "Fira Code", monospace; background: var(--bg); color: var(--text); line-height: 1.4; font-size: 0.85rem; }

    header { border-bottom: 2px solid var(--industrial); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; background: var(--surface); }
    h1 { font-size: 1.1rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
    h1 span { color: var(--accent); }

    .telemetry-window {
        background: #000; border: 1px solid var(--industrial); padding: 0.75rem 1.5rem;
        margin: 1.5rem 2rem; color: var(--green); font-size: 0.75rem; min-height: 4.5rem;
        display: flex; flex-direction: column; justify-content: center; gap: 0.3rem;
    }
    .telemetry-line { display: flex; gap: 2rem; }
    .telemetry-line span { opacity: 0.8; }

    .console-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; padding: 0 2rem 2rem; }
    .track-card { background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--industrial); padding: 1.5rem; }
    .track-card h2 { font-size: 0.9rem; margin-bottom: 1rem; color: var(--muted); text-transform: uppercase; }
    .track-card button {
        width: 100%; padding: 0.75rem; background: var(--surface2); color: var(--accent);
        border: 1px solid var(--accent); cursor: pointer; font-weight: bold; text-transform: uppercase;
        transition: all 0.2s;
    }
    .track-card button:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
    .track-card button:disabled { opacity: 0.3; cursor: not-allowed; }

    .tri-pane { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--border); border-top: 2px solid var(--industrial); min-height: 60vh; }
    .pane { background: var(--bg); padding: 1.5rem; overflow-y: auto; max-height: 70vh; }
    .pane-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--industrial);
    }
    .pane-header h3 { font-size: 0.8rem; text-transform: uppercase; color: var(--industrial); letter-spacing: 1px; }
    .pane-count { font-size: 0.7rem; background: var(--surface2); padding: 0.1rem 0.5rem; border-radius: 10px; }

    .card { background: var(--surface); border: 1px solid var(--border); padding: 1rem; margin-bottom: 1rem; position: relative; }
    .card h4 { color: var(--text); margin-bottom: 0.4rem; font-size: 0.9rem; }
    .card .meta { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.8rem; display: flex; gap: 0.8rem; }
    .score-tag { color: var(--green); font-weight: bold; }

    .bridge-item { background: rgba(251, 191, 36, 0.05); border-left: 3px solid var(--amber); padding: 0.5rem; margin-top: 0.5rem; }
    .bridge-label { font-size: 0.65rem; color: var(--amber); text-transform: uppercase; margin-bottom: 0.2rem; }
    .inline-edit {
        width: 100%; background: transparent; border: none; border-bottom: 1px dashed var(--industrial);
        color: var(--text); font-size: 0.75rem; padding: 0.2rem 0; margin-top: 0.4rem; outline: none;
    }

    .outreach-box { font-size: 0.75rem; color: var(--muted); background: var(--surface2); padding: 0.75rem; border: 1px dashed var(--industrial); white-space: pre-wrap; }

    .export-hub { padding: 1.5rem 2rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; }
    .btn-export { background: var(--industrial); color: #fff; border: none; padding: 0.8rem 2rem; cursor: pointer; font-weight: bold; text-transform: uppercase; }

    #login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
    #login-overlay.hidden { display: none; }
    .login-box { background: var(--surface); border: 1px solid var(--industrial); padding: 2rem; width: 320px; }
    .login-box input { width: 100%; padding: 0.6rem; margin-bottom: 1rem; background: var(--bg); border: 1px solid var(--border); color: var(--text); }
    .login-box button { width: 100%; padding: 0.6rem; background: var(--accent); color: var(--bg); border: none; font-weight: bold; cursor: pointer; }

    #app-main.hidden { display: none; }
  </style>
</head>
<body>
  <div id="login-overlay">
    <div class="login-box">
      <h2 style="margin-bottom:1.5rem; font-size:0.9rem; text-transform:uppercase">Auth Gateway</h2>
      <form id="login-form">
        <input id="username" placeholder="OPERATOR_ID" required />
        <input id="password" type="password" placeholder="ACCESS_KEY" required />
        <button type="submit">INITIALIZE</button>
      </form>
    </div>
  </div>

  <div id="app-main" class="hidden">
    <header>
      <h1>Strategic <span>Opportunity</span> Hub</h1>
      <div style="display:flex; gap: 1rem">
          <button id="btn-logout" style="background:none; border: 1px solid var(--industrial); color: var(--muted); padding: 0.3rem 0.8rem; font-size: 0.7rem; cursor:pointer">TERMINATE SESSION</button>
      </div>
    </header>

    <main>
      <div style="padding: 0 2rem; margin-top: 1rem; display: flex; gap: 1rem; align-items: center;">
          <input type="text" id="global-search" placeholder="SEARCH_GLOBAL_POOLS..." style="flex: 1; background: var(--surface2); border: 1px solid var(--industrial); color: var(--text); padding: 0.6rem; font-family: monospace; font-size: 0.8rem;" />
          <select id="filter-posted" style="background: var(--surface2); border: 1px solid var(--industrial); color: var(--muted); padding: 0.6rem; font-size: 0.75rem;">
              <option value="">ALL_POSTED</option>
              <option value="1">PAST_24H</option>
              <option value="3">PAST_3D</option>
              <option value="7">PAST_7D</option>
          </select>
      </div>

      <div class="telemetry-window" id="telemetry">
          <div class="telemetry-line">
              <span>[SYSTEM_STATUS]: <b id="sys-status">IDLE</b></span>
              <span>[RUNTIME]: <b id="elapsed">0.00s</b></span>
          </div>
          <div class="telemetry-line">
              <span>[PROXY_ROTATION]: <b id="proxy-status" style="color:var(--industrial)">INACTIVE</b></span>
              <span>[JITTER_VAL]: <b id="jitter-val">0ms</b></span>
          </div>
      </div>

      <div class="console-grid">
          <div class="track-card">
              <h2>Semiconductors</h2>
              <button onclick="runTrack('semiconductors')" id="btn-semi">Run Track Scan</button>
          </div>
          <div class="track-card">
              <h2>Renewables</h2>
              <button onclick="runTrack('renewables')" id="btn-renew">Run Track Scan</button>
          </div>
          <div class="track-card">
              <h2>Data Centers</h2>
              <button onclick="runTrack('datacenters')" id="btn-data">Run Track Scan</button>
          </div>
      </div>

      <div class="tri-pane">
          <!-- Pane 1: Direct Clearances -->
          <div class="pane" id="pane-clearances">
              <div class="pane-header">
                  <h3>Direct Clearances</h3>
                  <span class="pane-count" id="count-clear">0</span>
              </div>
              <div id="feed-clearances"></div>
          </div>

          <!-- Pane 2: Project Bridge Lab -->
          <div class="pane" id="pane-bridge">
              <div class="pane-header">
                  <h3>Project Bridge Lab</h3>
                  <span class="pane-count" id="count-bridge">0</span>
              </div>
              <div id="feed-bridge"></div>
          </div>

          <!-- Pane 3: Outreach Vault -->
          <div class="pane" id="pane-outreach">
              <div class="pane-header">
                  <h3>Outreach Vault</h3>
                  <span class="pane-count" id="count-outreach">0</span>
              </div>
              <div id="feed-outreach"></div>
          </div>
      </div>

      <div class="export-hub">
          <button class="btn-export" onclick="exportInventory()">Export Inventory (CSV)</button>
      </div>
    </main>
  </div>

  <script>
    let allData = [];
    let runtimeInterval = null;
    let startTime = null;

    async function api(path, options = {}) {
      const res = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', ...options.headers } });
      if (res.status === 401) { location.reload(); }
      return res;
    }

    async function checkSession() {
        const res = await fetch('/auth/me');
        if (res.ok) { showApp(); loadData(); }
    }

    function showApp() {
        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('app-main').classList.remove('hidden');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        if (res.ok) { showApp(); loadData(); }
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
        fetch('/auth/logout', { method: 'POST' }).then(() => location.reload());
    });

    async function loadData() {
        const res = await api('/opportunities');
        allData = await res.json();
        renderPanes();
    }

    document.getElementById('global-search').addEventListener('input', renderPanes);
    document.getElementById('filter-posted').addEventListener('change', renderPanes);

    function renderPanes() {
        const query = document.getElementById('global-search').value.toLowerCase();
        const timeLimit = document.getElementById('filter-posted').value;
        const clearFeed = document.getElementById('feed-clearances');
        const bridgeFeed = document.getElementById('feed-bridge');
        const outreachFeed = document.getElementById('feed-outreach');

        clearFeed.innerHTML = ''; bridgeFeed.innerHTML = ''; outreachFeed.innerHTML = '';

        const filtered = allData.filter(r => {
            const text = `${r.role_title} ${r.company_name} ${r.target_sector} ${r.metro_hub}`.toLowerCase();
            if (query && !text.includes(query)) return false;

            if (timeLimit) {
                const days = Number(timeLimit);
                const date = new Date(r.posted_at || r.created_at);
                if (Date.now() - date.getTime() > days * 24 * 60 * 60 * 1000) return false;
            }
            return true;
        });

        const direct = filtered.filter(r => r.relevance_score >= 0.8);
        const bridge = filtered.filter(r => r.relevance_score >= 0.5 && r.relevance_score < 0.8);
        const outreach = filtered.filter(r => r.status === 'Reviewed' || r.tailored_pitch);

        document.getElementById('count-clear').textContent = direct.length;
        document.getElementById('count-bridge').textContent = bridge.length;
        document.getElementById('count-outreach').textContent = outreach.length;

        direct.forEach(r => {
            clearFeed.innerHTML += `
                <div class="card">
                    <h4>${r.role_title}</h4>
                    <div class="meta">
                        <span>${r.company_name}</span>
                        <span class="score-tag">SCORE: ${r.relevance_score}</span>
                    </div>
                    <button style="font-size:0.6rem; padding:0.2rem 0.5rem; background:var(--accent); color:var(--bg); border:none; cursor:pointer">LAUNCH ACTION</button>
                </div>
            `;
        });

        bridge.forEach(r => {
            bridgeFeed.innerHTML += `
                <div class="card">
                    <h4>${r.role_title}</h4>
                    <div class="meta"><span>${r.company_name}</span></div>
                    <div class="bridge-item">
                        <div class="bridge-label">Bridge Gap: Missing PSCAD/SAP Reconciliation</div>
                        <input class="inline-edit" value="Tailoring site management for infrastructure expansion..." />
                    </div>
                </div>
            `;
        });

        outreach.forEach(r => {
            outreachFeed.innerHTML += `
                <div class="card">
                    <h4>${r.role_title}</h4>
                    <div class="meta"><span>${r.company_name}</span> | <a href="${r.source_url}" target="_blank" style="color:var(--accent)">PROFILE</a></div>
                    <div class="outreach-box">${r.tailored_pitch || 'Drafting industrial outreach copy...'}</div>
                </div>
            `;
        });
    }

    async function runTrack(track) {
        document.getElementById('sys-status').textContent = 'ACTIVE_SCAN';
        document.getElementById('sys-status').style.color = 'var(--red)';
        document.getElementById('proxy-status').textContent = 'ROTATING_RESIDENTIAL';
        document.getElementById('proxy-status').style.color = 'var(--green)';

        startTime = Date.now();
        runtimeInterval = setInterval(() => {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
            document.getElementById('elapsed').textContent = elapsed + 's';
            document.getElementById('jitter-val').textContent = Math.floor(Math.random() * 500) + 'ms';
        }, 100);

        const btns = ['btn-semi', 'btn-renew', 'btn-data'];
        btns.forEach(b => document.getElementById(b).disabled = true);

        try {
            await api(`/scan/${track}`, { method: 'POST' });
        } finally {
            clearInterval(runtimeInterval);
            document.getElementById('sys-status').textContent = 'IDLE';
            document.getElementById('sys-status').style.color = 'var(--green)';
            document.getElementById('proxy-status').textContent = 'INACTIVE';
            document.getElementById('proxy-status').style.color = 'var(--industrial)';
            btns.forEach(b => document.getElementById(b).disabled = false);
            loadData();
        }
    }

    async function exportInventory() {
        window.location.href = '/export/inventory';
    }

    // Helper for CSS var in JS
    function getVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
    const varOld = window.var;
    window.var = (name) => getVar(name);

    checkSession();
  </script>
</body>
</html>
