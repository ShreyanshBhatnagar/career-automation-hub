<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunity Map — Central Ops</title>
  <style>
    :root {
      --bg: #0a0e14; --surface: #141b26; --surface2: #1c2636;
      --border: #2a3a52; --text: #e8edf4; --muted: #7d92ad;
      --accent: #3d9cf5; --green: #34d399; --amber: #fbbf24; --red: #f87171; --industrial: #52637a;
      --cyan: #22d3ee; --cyan-dim: rgba(34, 211, 238, 0.1);
      --sidebar-w: 240px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "SF Mono", "Fira Code", monospace; background: var(--bg); color: var(--text); line-height: 1.4; font-size: 0.85rem; display: flex; height: 100vh; overflow: hidden; }

    .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 2px solid var(--industrial); display: flex; flex-direction: column; padding: 1.5rem; }
    .sidebar h1 { font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 2.5rem; }
    .sidebar h1 span { color: var(--accent); }
    .nav-item { color: var(--muted); text-decoration: none; padding: 0.8rem 1rem; border-radius: 4px; margin-bottom: 0.5rem; transition: all 0.2s; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
    .nav-item:hover, .nav-item.active { background: var(--surface2); color: var(--accent); }
    .nav-item.active { border-left: 3px solid var(--accent); border-top-left-radius: 0; border-bottom-left-radius: 0; }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    header { border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; background: var(--surface); }
    #global-search {
        width: 280px !important;
        transition: all 0.3s;
        box-shadow: 0 0 5px rgba(61, 156, 245, 0.1);
    }
    #global-search:focus {
        width: 320px !important;
        box-shadow: 0 0 15px rgba(61, 156, 245, 0.4);
        border-color: var(--accent);
        outline: none;
    }
    .hstat { display: flex; flex-direction: column; align-items: center; }
    .hstat .lbl { color: var(--muted); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .hstat .val { font-size: 1rem; font-weight: bold; }
    .val.green { color: var(--green); }
    .val.cyan { color: var(--cyan); }

    .matrix-viewport { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .tri-pane { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--border); border-top: 1px solid var(--industrial); flex: 1; }
    .pane { background: var(--bg); padding: 1.5rem; overflow-y: auto; }
    .pane-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--industrial); }
    .pane-header h3 { font-size: 0.8rem; text-transform: uppercase; color: var(--industrial); letter-spacing: 1px; }
    .pane-count { font-size: 0.7rem; background: var(--surface2); padding: 0.1rem 0.5rem; border-radius: 10px; }

    .card { background: var(--surface); border: 1px solid var(--border); padding: 1rem; margin-bottom: 1rem; }
    .card h4 { color: var(--text); margin-bottom: 0.4rem; font-size: 0.9rem; }
    .card .meta { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.8rem; display: flex; gap: 0.8rem; }
    .score-tag { color: var(--green); font-weight: bold; }
    .bridge-item { background: rgba(251, 191, 36, 0.05); border-left: 3px solid var(--amber); padding: 0.5rem; margin-top: 0.5rem; }
    .bridge-label { font-size: 0.65rem; color: var(--amber); text-transform: uppercase; margin-bottom: 0.2rem; }
    .outreach-box { font-size: 0.75rem; color: var(--muted); background: var(--surface2); padding: 0.75rem; border: 1px dashed var(--industrial); white-space: pre-wrap; }

    .btn-export { background: var(--industrial); color: #fff; border: none; padding: 0.6rem 1.2rem; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.7rem; }

    #login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
    #login-overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div id="login-overlay">
    <div style="background: var(--surface); border: 1px solid var(--industrial); padding: 2rem; width: 320px;">
      <h2 style="margin-bottom:1.5rem; font-size:0.9rem; text-transform:uppercase">Auth Gateway</h2>
      <form id="login-form">
        <input id="username" placeholder="OPERATOR_ID" style="width:100%; padding:0.6rem; margin-bottom:1rem; background:var(--bg); border:1px solid var(--border); color:var(--text);" required />
        <input id="password" type="password" placeholder="ACCESS_KEY" style="width:100%; padding:0.6rem; margin-bottom:1rem; background:var(--bg); border:1px solid var(--border); color:var(--text);" required />
        <button type="submit" style="width:100%; padding:0.6rem; background:var(--accent); color:var(--bg); border:none; font-weight:bold; cursor:pointer;">INITIALIZE</button>
      </form>
    </div>
  </div>

  <div class="sidebar">
      <h1>STRAT <span>OPS</span></h1>
      <a href="/" class="nav-item active">Central Matrix</a>
      <a href="/linkedin.html" class="nav-item">LinkedIn Portal</a>
      <a href="/scanners.html" class="nav-item">Ingestion Control</a>
      <a href="/profile.html" class="nav-item">Config Vault</a>
      <div style="margin-top: auto;">
          <button id="btn-logout" style="width:100%; background:none; border: 1px solid var(--industrial); color: var(--muted); padding: 0.5rem; font-size: 0.65rem; cursor:pointer">TERMINATE SESSION</button>
      </div>
  </div>

  <div class="main-content" id="app-main">
    <header>
      <div style="display:flex; gap: 1.5rem; align-items: center;">
          <input type="text" id="global-search" placeholder="SEARCH_POOLS..." style="background: var(--surface2); border: 1px solid var(--industrial); color: var(--text); padding: 0.5rem; font-family: monospace; font-size: 0.75rem;" />
          <select id="filter-metro" style="background: var(--surface2); border: 1px solid var(--industrial); color: var(--muted); padding: 0.5rem; font-size: 0.7rem;">
              <option value="">ALL_METROS</option>
          </select>
          <select id="filter-posted" style="background: var(--surface2); border: 1px solid var(--industrial); color: var(--muted); padding: 0.5rem; font-size: 0.7rem;">
              <option value="">ALL_POSTED</option>
              <option value="1">PAST_24H</option>
              <option value="3">PAST_3D</option>
              <option value="7">PAST_7D</option>
          </select>
          <div class="hstat">
            <span class="lbl">Clearances</span>
            <span class="val green" id="stat-clearances">0</span>
          </div>
          <div class="hstat">
            <span class="lbl">High Coverage</span>
            <span class="val cyan" id="stat-coverage">—</span>
          </div>
      </div>
      <button class="btn-export" onclick="exportInventory()">Export Data Inventory</button>
    </header>

    <div class="matrix-viewport">
        <div class="tri-pane">
            <div class="pane" id="pane-clearances">
                <div class="pane-header"><h3>Direct Clearances</h3><span class="pane-count" id="count-clear">0</span></div>
                <div id="feed-clearances"></div>
            </div>
            <div class="pane" id="pane-bridge">
                <div class="pane-header"><h3>Project Bridge Lab</h3><span class="pane-count" id="count-bridge">0</span></div>
                <div id="feed-bridge"></div>
            </div>
            <div class="pane" id="pane-outreach">
                <div class="pane-header"><h3>Outreach Vault</h3><span class="pane-count" id="count-outreach">0</span></div>
                <div id="feed-outreach"></div>
            </div>
        </div>
    </div>
  </div>

  <script>
    let allData = [];
    async function api(path, options = {}) {
      const res = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', ...options.headers } });
      if (res.status === 401) { location.reload(); }
      return res;
    }
    async function checkSession() {
        const res = await fetch('/auth/me');
        if (res.ok) { document.getElementById('login-overlay').classList.add('hidden'); loadData(); }
    }
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const res = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        if (res.ok) location.reload();
    });
    document.getElementById('btn-logout').addEventListener('click', () => {
        fetch('/auth/logout', { method: 'POST' }).then(() => location.reload());
    });
    async function loadData() {
        const res = await api('/opportunities');
        allData = await res.json();
        const profileRes = await fetch('/profile');
        const profile = await profileRes.json();
        if (profile.operational_boundaries?.geographic_grid) {
            const grid = profile.operational_boundaries.geographic_grid;
            const metros = Object.values(grid).flat();
            const select = document.getElementById('filter-metro');
            metros.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m.toUpperCase();
                select.appendChild(opt);
            });
        }
        renderPanes();
    }
    document.getElementById('global-search').addEventListener('input', renderPanes);
    document.getElementById('filter-posted').addEventListener('change', renderPanes);
    document.getElementById('filter-metro').addEventListener('change', renderPanes);

    function renderPanes() {
        const query = document.getElementById('global-search').value.toLowerCase();
        const timeLimit = document.getElementById('filter-posted').value;
        const metroLimit = document.getElementById('filter-metro').value;
        const clearFeed = document.getElementById('feed-clearances');
        const bridgeFeed = document.getElementById('feed-bridge');
        const outreachFeed = document.getElementById('feed-outreach');
        clearFeed.innerHTML = ''; bridgeFeed.innerHTML = ''; outreachFeed.innerHTML = '';

        const filtered = allData.filter(r => {
            const text = `${r.role_title} ${r.company_name} ${r.target_sector} ${r.metro_hub} ${r.location}`.toLowerCase();
            if (query && !text.includes(query)) return false;
            if (metroLimit && !text.includes(metroLimit.toLowerCase())) return false;
            if (timeLimit) {
                const days = Number(timeLimit);
                const date = new Date(r.posted_at || r.created_at);
                if (Date.now() - date.getTime() > days * 24 * 60 * 60 * 1000) return false;
            }
            return true;
        });

        const direct = filtered.filter(r => r.relevance_score >= 0.85 || (r.coverage_score >= 0.67 && r.relevance_score >= 0.7));
        const bridge = filtered.filter(r => (r.relevance_score >= 0.5 && r.relevance_score < 0.85) && !direct.includes(r));
        const outreach = filtered.filter(r => r.status === 'Reviewed' || r.tailored_pitch);

        document.getElementById('count-clear').textContent = direct.length;
        document.getElementById('count-bridge').textContent = bridge.length;
        document.getElementById('count-outreach').textContent = outreach.length;

        document.getElementById('stat-clearances').textContent = direct.filter(r => r.relevance_score >= 0.85).length;
        document.getElementById('stat-coverage').textContent = filtered.filter(r => r.coverage_score >= 0.67).length;

        direct.forEach(r => {
            const coverageBadge = r.coverage_score != null ? `<span class="tag" style="background:var(--cyan-dim); color:var(--cyan); border: 1px solid var(--cyan); padding: 0.05rem 0.3rem; border-radius: 4px; font-size: 0.6rem; margin-left: 0.5rem;">⬡ node ${Math.round(r.coverage_score * 100)}%</span>` : '';
            clearFeed.innerHTML += `<div class="card" onclick="applyForRole(${r.id})" style="cursor:pointer"><h4>${r.role_title}</h4><div class="meta"><span>${r.company_name}</span><span class="score-tag">SCORE: ${r.relevance_score}</span>${coverageBadge}</div></div>`;
        });
        bridge.forEach(r => {
            const coverageBadge = r.coverage_score != null ? `<span class="tag" style="background:var(--cyan-dim); color:var(--cyan); border: 1px solid var(--cyan); padding: 0.05rem 0.3rem; border-radius: 4px; font-size: 0.6rem; margin-left: 0.5rem;">⬡ node ${Math.round(r.coverage_score * 100)}%</span>` : '';
            bridgeFeed.innerHTML += `<div class="card"><h4>${r.role_title}</h4><div class="meta"><span>${r.company_name}</span>${coverageBadge}</div><div class="bridge-item"><div class="bridge-label">Bridge Gap</div><div style="font-size:0.75rem">${r.description?.slice(0, 100)}...</div></div></div>`;
        });
        outreach.forEach(r => {
            outreachFeed.innerHTML += `<div class="card"><h4>${r.role_title}</h4><div class="meta"><span>${r.company_name}</span></div><div class="outreach-box">${r.tailored_pitch || 'Drafting...'}</div></div>`;
        });
    }

    async function applyForRole(id) {
        await api(`/api/opportunities/${id}/tailor-resume`, { method: 'POST', body: JSON.stringify({}) });
        setTimeout(() => loadData(), 1500);
    }

    function exportInventory() { window.location.href = '/export/inventory'; }
    checkSession();
  </script>
</body>
</html>
