<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunity Map — Config Vault</title>
  <style>
    :root {
      --bg: #0a0e14; --surface: #141b26; --surface2: #1c2636;
      --border: #2a3a52; --text: #e8edf4; --muted: #7d92ad;
      --accent: #3d9cf5; --green: #34d399; --red: #f87171; --industrial: #52637a;
      --sidebar-w: 240px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "SF Mono", "Fira Code", monospace; background: var(--bg); color: var(--text); line-height: 1.4; font-size: 0.85rem; display: flex; height: 100vh; overflow: hidden; }

    .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 2px solid var(--industrial); display: flex; flex-direction: column; padding: 1.5rem; }
    .sidebar h1 { font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 2.5rem; }
    .sidebar h1 span { color: var(--accent); }
    .nav-item { color: var(--muted); text-decoration: none; padding: 0.8rem 1rem; border-radius: 4px; margin-bottom: 0.5rem; transition: all 0.2s; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; }
    .nav-item:hover, .nav-item.active { background: var(--surface2); color: var(--accent); }
    .nav-item.active { border-left: 3px solid var(--accent); border-top-left-radius: 0; border-bottom-left-radius: 0; }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 2rem; }

    .form-group { margin-bottom: 2rem; border: 1px solid var(--border); background: var(--surface); padding: 1.5rem; }
    .form-group h2 { font-size: 0.8rem; text-transform: uppercase; color: var(--industrial); margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

    label { display: block; font-size: 0.7rem; color: var(--muted); margin-bottom: 0.5rem; text-transform: uppercase; }
    input, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.75rem; font-family: inherit; font-size: 0.8rem; margin-bottom: 1rem; }
    textarea { height: 100px; resize: none; }

    .btn-save { background: var(--accent); color: var(--bg); border: none; padding: 0.8rem 2rem; cursor: pointer; font-weight: bold; text-transform: uppercase; }
    #status-msg { margin-top: 1rem; font-size: 0.75rem; color: var(--green); }
  </style>
</head>
<body>
  <div class="sidebar">
      <h1>STRAT <span>OPS</span></h1>
      <a href="/" class="nav-item">Central Matrix</a>
      <a href="/linkedin.html" class="nav-item">LinkedIn Portal</a>
      <a href="/scanners.html" class="nav-item">Ingestion Control</a>
      <a href="/profile.html" class="nav-item active">Config Vault</a>
  </div>

  <div class="main-content">
    <h1 style="font-size: 1.2rem; text-transform: uppercase; color: var(--industrial); margin-bottom: 2rem;">Human-Native Configuration</h1>

    <form id="profile-form">
        <!-- Telemetry -->
        <div class="form-group">
            <h2>Human Telemetry</h2>
            <label>Full Operator Name</label>
            <input id="name" type="text" />
            <label>LinkedIn Session Key (li_at)</label>
            <input id="li_at" type="text" placeholder="AQED..." />
        </div>

        <!-- Experience & Portfolio -->
        <div class="form-group">
            <h2>Experience & Portfolio Blocks</h2>
            <label>Core Project Portfolios (Semicolon separated)</label>
            <textarea id="portfolios"></textarea>
            <label>Target Credentials</label>
            <input id="credentials" type="text" placeholder="B.E. Electrical, 10y Exp..." />
        </div>

        <!-- Style & Tone -->
        <div class="form-group">
            <h2>Subjective Style Parameters</h2>
            <label>Writing Tone</label>
            <input id="tone" type="text" placeholder="Direct, Industrial..." />
            <label>Preferred Industrial Terms (Comma separated)</label>
            <input id="preferred_terms" type="text" />
            <label>Vocabulary Exclusion (Comma separated)</label>
            <input id="avoid_terms" type="text" />
        </div>

        <button type="submit" class="btn-save">Save Configuration</button>
        <div id="status-msg"></div>
    </form>
  </div>

  <script>
    async function loadProfile() {
        const res = await fetch('/profile');
        const data = await res.json();
        if (data.human_telemetry) {
            const h = data.human_telemetry;
            document.getElementById('name').value = h.name || '';
            document.getElementById('li_at').value = h.linkedin_keys?.li_at || '';
            document.getElementById('portfolios').value = (h.project_portfolios || []).join('; ');
            document.getElementById('tone').value = h.writing_style_vectors?.tone || '';
            document.getElementById('preferred_terms').value = (h.writing_style_vectors?.preferred_terms || []).join(', ');
            document.getElementById('avoid_terms').value = (h.writing_style_vectors?.avoid_terms || []).join(', ');
        }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('status-msg');
        msg.textContent = 'SAVING_VAULT_VARIABLES...';

        const body = {
            human_telemetry: {
                name: document.getElementById('name').value,
                linkedin_keys: { li_at: document.getElementById('li_at').value },
                project_portfolios: document.getElementById('portfolios').value.split(';').map(s => s.trim()).filter(Boolean),
                writing_style_vectors: {
                    tone: document.getElementById('tone').value,
                    preferred_terms: document.getElementById('preferred_terms').value.split(',').map(s => s.trim()).filter(Boolean),
                    avoid_terms: document.getElementById('avoid_terms').value.split(',').map(s => s.trim()).filter(Boolean)
                }
            },
            operational_boundaries: {
                geographic_grid: ["Delhi NCR", "Mumbai", "Pune", "Ahmedabad", "Indore", "Bangalore", "Hyderabad", "Chennai", "Kolkata", "Surat", "Vadodara", "Nagpur"],
                excluded_regions: ["Northeast India", "Ladakh", "Kashmir", "Himachal Pradesh", "Uttarakhand"]
            }
        };

        const res = await fetch('/profile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (res.ok) {
            msg.textContent = 'VAULT_SYNCHRONIZED_SUCCESSFULLY';
            setTimeout(() => { msg.textContent = ''; }, 3000);
        }
    });

    loadProfile();
  </script>
</body>
</html>
